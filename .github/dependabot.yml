version: 2
updates:
  - package-ecosystem: composer
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - php

  - package-ecosystem: npm
    directory: /
    target-branch: develop
    ignore:
      # TypeScript 7 is the native compiler; vue-tsc 3 cannot load it yet (ERR_PACKAGE_PATH_NOT_EXPORTED).
      - dependency-name: typescript
        update-types: [version-update:semver-major]
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - javascript

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
